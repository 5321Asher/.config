# Memphis's fallback lock screen (hyprlock), for when Memphis's own Quickshell lock isn't answering:
# the plain desktop colour and a 98 logon box drawn from shapes: grey face, navy caption, "Welcome
# to Memphis", a white password box. Colours and fonts come from the scheme: hyprlock-colors.conf is
# rewritten by ~/.config/theme/theme (it includes Memphis's own keys: $desktop, $face, $title…).
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

$font        = monospace
$fontDisplay = serif

# Fallbacks until hyprlock-colors.conf exists (overridden by the source below)
$fg          = rgb(000000)
$danger      = rgb(c00000)
$desktop     = rgb(008080)
$face        = rgb(c0c0c0)
$hilight     = rgb(ffffff)
$shadow      = rgb(808080)
$dkShadow    = rgb(000000)
$window      = rgb(ffffff)
$title       = rgb(000080)
$title2      = rgb(1084d0)
$titleText   = rgb(ffffff)

source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = false
    ignore_empty_input = true
}

# 98 didn't fade
animations {
    enabled = false
}

background {
    monitor =
    color = $desktop
}

# the box: a black edge, a white edge, the grey face
shape {
    monitor =
    size = 474, 234
    color = $dkShadow
    rounding = 0
    position = 1, -1
    halign = center
    valign = center
}
shape {
    monitor =
    size = 472, 232
    color = $face
    rounding = 0
    border_size = 1
    border_color = $hilight
    position = 0, 0
    halign = center
    valign = center
}
# the caption, left to right in the title colours
shape {
    monitor =
    size = 464, 26
    color = $title
    rounding = 0
    border_size = 0
    position = 0, 99
    halign = center
    valign = center
}
label {
    monitor =
    text = <b>Welcome to Memphis</b>
    color = $titleText
    font_size = 12
    font_family = $font
    position = -150, 99
    halign = center
    valign = center
}

label {
    monitor =
    text = Type your password to unlock Memphis.
    color = $fg
    font_size = 12
    font_family = $font
    position = 10, 56
    halign = center
    valign = center
}
label {
    monitor =
    text = User name:  $USER
    color = $fg
    font_size = 12
    font_family = $font
    position = -40, 18
    halign = center
    valign = center
}
label {
    monitor =
    text = Password:
    color = $fg
    font_size = 12
    font_family = $font
    position = -150, -24
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 220, 28
    rounding = 0
    outline_thickness = 2
    outer_color = $shadow
    inner_color = $window
    font_color = $fg
    check_color = $title
    fail_color = $danger
    capslock_color = $danger
    font_family = $font
    placeholder_text =
    fail_text = The password is not correct.
    fade_on_empty = false
    dots_size = 0.3
    dots_spacing = 0.3
    dots_center = false
    dots_rounding = 0
    position = 40, -24
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d   %-I:%M %p"
    color = $titleText
    font_size = 12
    font_family = $font
    position = -12, 12
    halign = right
    valign = bottom
}

# ~/.config/kitty/kitty.conf (Memphis)
# The MS-DOS Prompt: the IBM VGA text-mode font on black, the 16 VGA colours, a blinking underscore.
# Colours come from the theme's [terminal] table (skwd-colors.conf, included at the end).
# Reload anytime: ctrl+shift+f5

# ─── Font ───────────────────────────────────────────────
# Find your exact font name with:  kitty +list-fonts | grep -i nerd
# font_family      Adiwata Nerd Font
# bold_font        auto
# italic_font      auto
# bold_italic_font auto
# The VGA font is drawn on an 8 x 16 grid: 12 pt (16 px) keeps it crisp
font_size        12.0
disable_ligatures always

# ─── Cursor ─────────────────────────────────────────────
cursor_shape               underline
cursor_underline_thickness 3.0
cursor_blink_interval      0.27
cursor_stop_blinking_after 0
cursor_trail               0

# ─── Window ─────────────────────────────────────────────
window_padding_width      4 6
placement_strategy        center
remember_window_size      yes
initial_window_width      120c
initial_window_height     34c
confirm_os_window_close   0
background_opacity        1
# Blur behind the window (macOS, KDE, and some Wayland compositors)
background_blur           0
dynamic_background_opacity yes

# Splits
enabled_layouts           splits,stack
window_border_width       1pt
draw_minimal_borders      yes
inactive_text_alpha       1.0

# ─── Tab bar ────────────────────────────────────────────
tab_bar_edge              top
tab_bar_margin_height     6.0 0.0
tab_bar_style             separator
tab_separator             " │ "
# (no powerline arrows in 1998)
tab_bar_min_tabs          2
tab_title_template        " {index}  {title} "
active_tab_font_style     bold
inactive_tab_font_style   normal

# ─── Behavior ───────────────────────────────────────────
scrollback_lines          10000
copy_on_select            yes
strip_trailing_spaces     smart
url_style                 single
detect_urls               yes
enable_audio_bell         no
visual_bell_duration      0.0
shell_integration         enabled
sync_to_monitor           yes

# ─── Keybindings ────────────────────────────────────────
# Splits (open in the current directory)
map ctrl+shift+enter      launch --location=hsplit --cwd=current
map ctrl+shift+backslash  launch --location=vsplit --cwd=current
map ctrl+shift+t          new_tab_with_cwd

# Move between splits
map ctrl+alt+h            neighboring_window left
map ctrl+alt+l            neighboring_window right
map ctrl+alt+k            neighboring_window up
map ctrl+alt+j            neighboring_window down

# Zoom the current split to full window and back
map ctrl+shift+z          toggle_layout stack

# Font size
map ctrl+equal            change_font_size all +1.0
map ctrl+minus            change_font_size all -1.0
map ctrl+0                change_font_size all 0

# Transparency on the fly
map ctrl+shift+a>m        set_background_opacity +0.05
map ctrl+shift+a>l        set_background_opacity -0.05
map ctrl+shift+a>1        set_background_opacity 1
map ctrl+shift+a>d        set_background_opacity default

# ─── OS-specific ────────────────────────────────────────
# macOS: uncomment these
# hide_window_decorations          titlebar-only
# macos_titlebar_color             background
# macos_option_as_alt              yes
# macos_show_window_title_in       none
# macos_quit_when_last_window_closed yes

# Linux: uncomment to drop the title bar entirely
# hide_window_decorations          yes
# linux_display_server             auto

# ─── Colors: Tokyo Night ────────────────────────────────
foreground              #c0caf5
background              #1a1b26
selection_foreground    #c0caf5
selection_background    #283457
url_color               #73daca
cursor                  #c0caf5
cursor_text_color       #1a1b26

active_border_color     #7aa2f7
inactive_border_color   #292e42
bell_border_color       #e0af68

tab_bar_background      #15161e
active_tab_foreground   #16161e
active_tab_background   #7aa2f7
inactive_tab_foreground #545c7e
inactive_tab_background #292e42

# black
color0  #15161e
color8  #414868
# red
color1  #f7768e
color9  #f7768e
# green
color2  #9ece6a
color10 #9ece6a
# yellow
color3  #e0af68
color11 #e0af68
# blue
color4  #7aa2f7
color12 #7aa2f7
# magenta
color5  #bb9af7
color13 #bb9af7
# cyan
color6  #7dcfff
color14 #7dcfff
# white
color7  #a9b1d6
color15 #c0caf5



# BEGIN_KITTY_FONTS
font_family      family="Px437 IBM VGA 8x16"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
# Nerd Font icons (prompt, ls) aren't in the VGA font: take them from a Nerd Font, at cell size
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFF CaskaydiaMono Nerd Font Mono
narrow_symbols U+E000-U+F8FF,U+F0000-U+FFFFF 1

# Wallpaper colours (generated by ~/.config/quickshell/scripts/wallpaper-colors.py)
include skwd-colors.conf

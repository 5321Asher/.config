# Windows Standard: The one it came with: teal desktop, grey windows, navy title bars.
name = "Windows Standard"
appearance = "light"
wallpaper = "memphis-standard-plain.png"   # generated by wallpapers.py

[palette]
bg          = "#c0c0c0"
bgDark      = "#ffffff"
surface     = "#c0c0c0"
hover       = "#dfdfdf"
border      = "#808080"
dim         = "#808080"
fg          = "#000000"
accent      = "#000080"
accentText  = "#ffffff"
accentMuted = "#b8b8db"
purple      = "#1084d0"
warn        = "#a06000"
danger      = "#c00000"
green       = "#008000"
# Memphis's own (Quickshell and style.py read these; other apps use the standard keys above)
desktop           = "#008080"
face              = "#c0c0c0"
light             = "#dfdfdf"
hilight           = "#ffffff"
shadow            = "#808080"
dkShadow          = "#000000"
window            = "#ffffff"
windowText        = "#000000"
btnText           = "#000000"
title             = "#000080"
title2            = "#1084d0"
titleText         = "#ffffff"
inactiveTitle     = "#808080"
inactiveTitle2    = "#b5b5b5"
inactiveTitleText = "#c0c0c0"
select            = "#000080"
selectText        = "#ffffff"
grayText          = "#808080"
info              = "#ffffe1"
infoText          = "#000000"
lcd               = "#000000"
lcdText           = "#00ff00"

# The MS-DOS Prompt: terminal apps (kitty, btop, Neovim) get these on top of the palette
[terminal]
bg          = "#000000"
bgDark      = "#000000"
surface     = "#0000aa"
hover       = "#0000aa"
border      = "#555555"
dim         = "#808080"
fg          = "#c0c0c0"
accent      = "#c0c0c0"
accentText  = "#000000"
accentMuted = "#0000aa"
purple      = "#55ffff"
warn        = "#ffff55"
danger      = "#ff5555"
green       = "#55ff55"

[terminal.syntax]
keyword   = "#55ffff"
function  = "#ffff55"
string    = "#55ff55"
type      = "#55ffff"
constant  = "#ff55ff"
property  = "#c0c0c0"
tag       = "#ff5555"
attribute = "#ffff55"
operator  = "#aaaaaa"
comment   = "#808080"

# The 16 VGA colours
[ansi]
black          = "#000000"
red            = "#aa0000"
green          = "#00aa00"
yellow         = "#aa5500"
blue           = "#0000aa"
magenta        = "#aa00aa"
cyan           = "#00aaaa"
white          = "#aaaaaa"
bright_black   = "#555555"
bright_red     = "#ff5555"
bright_green   = "#55ff55"
bright_yellow  = "#ffff55"
bright_blue    = "#5555ff"
bright_magenta = "#ff55ff"
bright_cyan    = "#55ffff"
bright_white   = "#ffffff"

# Visual C++ 6 on white
[syntax]
keyword   = "#0000ff"
function  = "#800080"
string    = "#800000"
type      = "#008080"
constant  = "#808000"
property  = "#000080"
tag       = "#800000"
attribute = "#ff0000"
operator  = "#000000"
comment   = "#008000"

# Marine: Sea-green windows over deep water.
name = "Marine"
appearance = "light"
wallpaper = "memphis-marine-plain.png"   # generated by wallpapers.py

[palette]
bg          = "#88c0b8"
bgDark      = "#ffffff"
surface     = "#88c0b8"
hover       = "#b0d8d0"
border      = "#4a8078"
dim         = "#4a8078"
fg          = "#000000"
accent      = "#008080"
accentText  = "#ffffff"
accentMuted = "#b8dbdb"
purple      = "#40c0b8"
warn        = "#a06000"
danger      = "#c00000"
green       = "#008000"
# Memphis's own (Quickshell and style.py read these; other apps use the standard keys above)
desktop           = "#004040"
face              = "#88c0b8"
light             = "#b0d8d0"
hilight           = "#e0f0ee"
shadow            = "#4a8078"
dkShadow          = "#000000"
window            = "#ffffff"
windowText        = "#000000"
btnText           = "#000000"
title             = "#008080"
title2            = "#40c0b8"
titleText         = "#ffffff"
inactiveTitle     = "#4a8078"
inactiveTitle2    = "#88c0b8"
inactiveTitleText = "#d0e8e4"
select            = "#008080"
selectText        = "#ffffff"
grayText          = "#4a8078"
info              = "#ffffe1"
infoText          = "#000000"
lcd               = "#000000"
lcdText           = "#00ff00"

# The MS-DOS Prompt: terminal apps (kitty, btop, Neovim) get these on top of the palette
[terminal]
bg          = "#000000"
bgDark      = "#000000"
surface     = "#0000aa"
hover       = "#0000aa"
border      = "#555555"
dim         = "#808080"
fg          = "#c0c0c0"
accent      = "#c0c0c0"
accentText  = "#000000"
accentMuted = "#0000aa"
purple      = "#55ffff"
warn        = "#ffff55"
danger      = "#ff5555"
green       = "#55ff55"

[terminal.syntax]
keyword   = "#55ffff"
function  = "#ffff55"
string    = "#55ff55"
type      = "#55ffff"
constant  = "#ff55ff"
property  = "#c0c0c0"
tag       = "#ff5555"
attribute = "#ffff55"
operator  = "#aaaaaa"
comment   = "#808080"

# The 16 VGA colours
[ansi]
black          = "#000000"
red            = "#aa0000"
green          = "#00aa00"
yellow         = "#aa5500"
blue           = "#0000aa"
magenta        = "#aa00aa"
cyan           = "#00aaaa"
white          = "#aaaaaa"
bright_black   = "#555555"
bright_red     = "#ff5555"
bright_green   = "#55ff55"
bright_yellow  = "#ffff55"
bright_blue    = "#5555ff"
bright_magenta = "#ff55ff"
bright_cyan    = "#55ffff"
bright_white   = "#ffffff"

# Visual C++ 6 on white
[syntax]
keyword   = "#0000ff"
function  = "#800080"
string    = "#800000"
type      = "#008080"
constant  = "#808000"
property  = "#000080"
tag       = "#800000"
attribute = "#ff0000"
operator  = "#000000"
comment   = "#008000"

# Blackwall: Past the wall: one colour, red, on nothing.
name = "Blackwall"
appearance = "dark"
wallpaper = "netrunner-blackwall-skyline.png"

[palette]
bg          = "#080405"
bgDark      = "#050203"
surface     = "#130e0f"
hover       = "#1c1617"
border      = "#301418"
dim         = "#704a50"
fg          = "#e8d0d2"
accent      = "#ff1f3a"
accentText  = "#080405"
accentMuted = "#4d0c14"
purple      = "#ff7a88"
warn        = "#ffb0a0"
danger      = "#ff1f3a"
green       = "#ff9aa6"
# Netrunner's own (Quickshell reads these)
bright      = "#fff0f0"
cyanDim     = "#52272c"

[ansi]
black          = "#060304"
red            = "#ff1f3a"
green          = "#ff9aa6"
yellow         = "#ffb0a0"
blue           = "#4a8cff"
magenta        = "#d65cff"
cyan           = "#ff7a88"
white          = "#caaeb2"
bright_black   = "#704a50"
bright_red     = "#ff4c61"
bright_green   = "#ffaeb8"
bright_yellow  = "#ffc0b3"
bright_blue    = "#7aaaff"
bright_magenta = "#e88cff"
bright_cyan    = "#ff9ba6"
bright_white   = "#fff0f0"

[syntax]
keyword   = "#ff1f3a"
function  = "#ff7a88"
string    = "#ff9aa6"
type      = "#ffb0a0"
constant  = "#ff686d"
property  = "#f69ca6"
tag       = "#ff1f3a"
attribute = "#ffb0a0"
operator  = "#704a50"
comment   = "#5b3c41"

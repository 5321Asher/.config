# Kiroshi: Optics-HUD yellow and electric cyan, the colours of the city's ads.
name = "Kiroshi"
appearance = "dark"
wallpaper = "netrunner-kiroshi-skyline.png"

[palette]
bg          = "#0b0b08"
bgDark      = "#070705"
surface     = "#161612"
hover       = "#1f1f1b"
border      = "#2e2e22"
dim         = "#707060"
fg          = "#e6e6d6"
accent      = "#fcee0a"
accentText  = "#0b0b08"
accentMuted = "#4e4b09"
purple      = "#00f0ff"
warn        = "#ff9d2a"
danger      = "#ff3a4c"
green       = "#58f29a"
# Netrunner's own (Quickshell reads these)
bright      = "#fffff2"
cyanDim     = "#085052"

[ansi]
black          = "#080806"
red            = "#ff3a4c"
green          = "#58f29a"
yellow         = "#ff9d2a"
blue           = "#4a8cff"
magenta        = "#d65cff"
cyan           = "#00f0ff"
white          = "#c8c8b8"
bright_black   = "#707060"
bright_red     = "#ff6a78"
bright_green   = "#79f5ae"
bright_yellow  = "#ffb155"
bright_blue    = "#7aaaff"
bright_magenta = "#e88cff"
bright_cyan    = "#40f4ff"
bright_white   = "#fffff2"

[syntax]
keyword   = "#fcee0a"
function  = "#00f0ff"
string    = "#58f29a"
type      = "#ff9d2a"
constant  = "#fec61a"
property  = "#5cecef"
tag       = "#fcee0a"
attribute = "#ff9d2a"
operator  = "#707060"
comment   = "#5c5c4e"

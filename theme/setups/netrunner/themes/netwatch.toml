# NetWatch: Agency blue and white-hot cyan: the ones watching the watchers.
name = "NetWatch"
appearance = "dark"
wallpaper = "netrunner-netwatch-skyline.png"

[palette]
bg          = "#070a12"
bgDark      = "#04060b"
surface     = "#11151d"
hover       = "#1a1e26"
border      = "#1f2a40"
dim         = "#5a6a84"
fg          = "#d8e4f4"
accent      = "#2f8cff"
accentText  = "#070a12"
accentMuted = "#122e54"
purple      = "#9ef0ff"
warn        = "#f5d76e"
danger      = "#2f8cff"
green       = "#5fe0b0"
# Netrunner's own (Quickshell reads these)
bright      = "#f4f8ff"
cyanDim     = "#344f59"

[ansi]
black          = "#05070d"
red            = "#ff3a4c"
green          = "#5fe0b0"
yellow         = "#f5d76e"
blue           = "#2f8cff"
magenta        = "#d65cff"
cyan           = "#9ef0ff"
white          = "#b8c6d8"
bright_black   = "#5a6a84"
bright_red     = "#ff6a78"
bright_green   = "#7fe6c0"
bright_yellow  = "#f7df8b"
bright_blue    = "#7aaaff"
bright_magenta = "#e88cff"
bright_cyan    = "#b6f4ff"
bright_white   = "#f4f8ff"

[syntax]
keyword   = "#2f8cff"
function  = "#9ef0ff"
string    = "#5fe0b0"
type      = "#f5d76e"
constant  = "#92b2b6"
property  = "#b5ebfb"
tag       = "#2f8cff"
attribute = "#f5d76e"
operator  = "#5a6a84"
comment   = "#49576d"

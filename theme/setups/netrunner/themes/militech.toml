# Militech: Field kit: hazard orange, olive drab readouts, gunmetal.
name = "Militech"
appearance = "dark"
wallpaper = "netrunner-militech-skyline.png"

[palette]
bg          = "#0c0c09"
bgDark      = "#070705"
surface     = "#171713"
hover       = "#1f1f1b"
border      = "#2c2c22"
dim         = "#6c6c58"
fg          = "#e0e0cc"
accent      = "#ff8a1f"
accentText  = "#0c0c09"
accentMuted = "#502f0f"
purple      = "#a8c64a"
warn        = "#ffd23f"
danger      = "#ff3a4c"
green       = "#a8c64a"
# Netrunner's own (Quickshell reads these)
bright      = "#fbfbee"
cyanDim     = "#3b441c"

[ansi]
black          = "#080806"
red            = "#ff3a4c"
green          = "#a8c64a"
yellow         = "#ffd23f"
blue           = "#4a8cff"
magenta        = "#d65cff"
cyan           = "#a8c64a"
white          = "#c3c3af"
bright_black   = "#6c6c58"
bright_red     = "#ff6a78"
bright_green   = "#b9d16e"
bright_yellow  = "#ffdb65"
bright_blue    = "#7aaaff"
bright_magenta = "#e88cff"
bright_cyan    = "#bed477"
bright_white   = "#fbfbee"

[syntax]
keyword   = "#ff8a1f"
function  = "#a8c64a"
string    = "#a8c64a"
type      = "#ffd23f"
constant  = "#ffae2f"
property  = "#bed07e"
tag       = "#ff8a1f"
attribute = "#ffd23f"
operator  = "#6c6c58"
comment   = "#595948"

# Afterlife: Neon magenta and ultraviolet, amber at the bar, smoke in the air.
name = "Afterlife"
appearance = "dark"
wallpaper = "netrunner-afterlife-skyline.png"

[palette]
bg          = "#0c0810"
bgDark      = "#07050a"
surface     = "#17131b"
hover       = "#201b24"
border      = "#2e2238"
dim         = "#6e5e7a"
fg          = "#eadcf0"
accent      = "#ff2aa1"
accentText  = "#0c0810"
accentMuted = "#501239"
purple      = "#a36bff"
warn        = "#ffb347"
danger      = "#ff2aa1"
green       = "#5ff2c4"
# Netrunner's own (Quickshell reads these)
bright      = "#fff6ff"
cyanDim     = "#392658"

[ansi]
black          = "#08060b"
red            = "#ff2aa1"
green          = "#5ff2c4"
yellow         = "#ffb347"
blue           = "#4a8cff"
magenta        = "#ff2aa1"
cyan           = "#a36bff"
white          = "#cbbcd2"
bright_black   = "#6e5e7a"
bright_red     = "#ff55b4"
bright_green   = "#7ff5d0"
bright_yellow  = "#ffc26c"
bright_blue    = "#7aaaff"
bright_magenta = "#e88cff"
bright_cyan    = "#ba90ff"
bright_white   = "#fff6ff"

[syntax]
keyword   = "#ff2aa1"
function  = "#a36bff"
string    = "#5ff2c4"
type      = "#ffb347"
constant  = "#ff6e74"
property  = "#bf98f9"
tag       = "#ff2aa1"
attribute = "#ffb347"
operator  = "#6e5e7a"
comment   = "#5a4d65"

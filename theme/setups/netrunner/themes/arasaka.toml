# Arasaka: Corporate crimson on black lacquer, cold white data, a thread of gold.
name = "Arasaka"
appearance = "dark"
wallpaper = "netrunner-arasaka-city.mp4"

[palette]
bg          = "#0b0909"
bgDark      = "#070505"
surface     = "#161413"
hover       = "#1e1c1c"
border      = "#2e2426"
dim         = "#6e6264"
fg          = "#e2dcd8"
accent      = "#e0162b"

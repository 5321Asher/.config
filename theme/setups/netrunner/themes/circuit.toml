# Circuit: The reference: signal red and ice cyan over near-black glass.
name = "Circuit"
appearance = "dark"
wallpaper = "netrunner-circuit-city.mp4"

[palette]
bg          = "#0a0d10"
bgDark      = "#06080a"
surface     = "#14181b"
hover       = "#1d2023"
border      = "#26323c"
dim         = "#5e6c76"
fg          = "#dce4e8"
accent      = "#ff3a4c"
accentText  = "#0a0d10"
accentMuted = "#4f1a21"
purple      = "#4fd6e0"
warn        = "#f2d24b"
danger      = "#ff3a4c"
green       = "#4fe0a0"
# Netrunner's own (Quickshell reads these)
bright      = "#f2f6f8"
cyanDim     = "#1f494e"

[ansi]
black          = "#07090b"
red            = "#ff3a4c"
green          = "#4fe0a0"
yellow         = "#f2d24b"
blue           = "#4a8cff"
magenta        = "#d65cff"
cyan           = "#4fd6e0"
white          = "#bcc6cc"
bright_black   = "#5e6c76"
bright_red     = "#ff6170"
bright_green   = "#72e6b3"
bright_yellow  = "#f5db6f"
bright_blue    = "#7aaaff"
bright_magenta = "#e88cff"
bright_cyan    = "#7be0e8"
bright_white   = "#f2f6f8"

[syntax]
keyword   = "#ff3a4c"
function  = "#4fd6e0"
string    = "#4fe0a0"
type      = "#f2d24b"
constant  = "#f8864c"
property  = "#87dce3"
tag       = "#ff3a4c"
attribute = "#f2d24b"
operator  = "#5e6c76"
comment   = "#4d5962"

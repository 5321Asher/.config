# Netrunner's fallback lock screen (hyprlock), for when Netrunner's own Quickshell lock isn't answering:
# the desktop blurred and darkened, SESSION SUSPENDED // ICE ACTIVE, the time with its seconds in red,
# OPERATOR // you, and a passphrase field. Colours and fonts come from the profile:
# hyprlock-colors.conf is rewritten by ~/.config/theme/theme.
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

$font        = monospace
$fontDisplay = sans-serif

$bgDark      = rgb(060809)
$fg          = rgb(dce4e8)
$dim         = rgb(5e6c76)
$accent      = rgb(ff3a4c)
$purple      = rgb(4fd6e0)
$border      = rgb(26323c)
$bright      = rgb(f2f6f8)

source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = snap, 0.2, 0.9, 0.1, 1
    animation = fadeIn, 1, 3, snap
    animation = fadeOut, 1, 3, snap
}

background {
    monitor =
    path = screenshot
    color = $bgDark
    blur_passes = 3
    blur_size = 7
    brightness = 0.45
}

label {
    monitor =
    text = <b>SESSION SUSPENDED</b>   <span foreground="##ff3a4c">//  ICE ACTIVE</span>
    color = $fg
    font_size = 11
    font_family = $font
    position = 36, -40
    halign = left
    valign = top
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $bright
    font_size = 120
    font_family = $fontDisplay
    position = 0, 170
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%S"
    color = $accent
    font_size = 30
    font_family = $fontDisplay
    position = 260, 120
    halign = center
    valign = center
}
label {
    monitor =
    text = OPERATOR  //  <b>$USER</b>
    color = $dim
    font_size = 11
    font_family = $font
    position = 0, 40
    halign = center
    valign = center
}
label {
    monitor =
    text = AUTH  //  PASSPHRASE
    color = $fg
    font_size = 11
    font_family = $font
    position = 0, -40
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 460, 46
    rounding = 0
    outline_thickness = 1
    outer_color = $border
    inner_color = rgba(06080999)
    font_color = $purple
    check_color = $purple
    fail_color = $accent
    capslock_color = $accent
    font_family = $font
    placeholder_text = <i>ENTER PASSPHRASE TO RESUME SESSION</i>
    fail_text = ACCESS DENIED  //  $ATTEMPTS
    fade_on_empty = false
    dots_size = 0.28
    dots_spacing = 0.5
    dots_center = true
    dots_rounding = 0
    position = 0, -95
    halign = center
    valign = center
}

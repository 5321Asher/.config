# Disguise: kitty as Windows Terminal. Cascadia Mono at 12, Campbell colours on #0c0c0c (every theme
# keeps the terminal dark, the way Windows Terminal ships), a steady bar cursor, WT's 8 px padding,
# and tabs across the top like WT's tab strip. Colours come from skwd-colors.conf (the theme's
# [terminal] table), included last so it wins.

font_size        12.0
disable_ligatures never

# ---------------------------------------------------------------- cursor
cursor_shape               beam
cursor_beam_thickness      1.5
cursor_blink_interval      0.53
cursor_stop_blinking_after 15
cursor_trail               0

# ---------------------------------------------------------------- window
window_padding_width      8
placement_strategy        top-left
remember_window_size      yes
initial_window_width      120c
initial_window_height     30c
confirm_os_window_close   0
background_opacity        1
background_blur           0
dynamic_background_opacity yes
enabled_layouts           splits,stack
window_border_width       1px
draw_minimal_borders      yes
inactive_text_alpha       1.0

# ---------------------------------------------------------------- tabs (Windows Terminal's tab strip)
tab_bar_edge              top
tab_bar_margin_width      6.0
tab_bar_margin_height     6.0 2.0
tab_bar_style             slant
tab_bar_min_tabs          2
tab_title_template        "  {title}  "
active_tab_font_style     normal
inactive_tab_font_style   normal

# ---------------------------------------------------------------- behaviour
scrollback_lines          10000
copy_on_select            yes
strip_trailing_spaces     smart
url_style                 single
detect_urls               yes
enable_audio_bell         no
visual_bell_duration      0.0
shell_integration         enabled
sync_to_monitor           yes

# ---------------------------------------------------------------- keys (Windows Terminal's where they exist)
map ctrl+shift+enter      launch --location=hsplit --cwd=current
map alt+shift+minus       launch --location=hsplit --cwd=current
map alt+shift+plus        launch --location=vsplit --cwd=current
map ctrl+shift+backslash  launch --location=vsplit --cwd=current
map ctrl+shift+t          new_tab_with_cwd
map ctrl+shift+w          close_tab
map ctrl+tab              next_tab
map ctrl+shift+tab        previous_tab
map alt+left              neighboring_window left
map alt+right             neighboring_window right
map alt+up                neighboring_window up
map alt+down              neighboring_window down
map ctrl+shift+z          toggle_layout stack
map ctrl+equal            change_font_size all +1.0
map ctrl+minus            change_font_size all -1.0
map ctrl+0                change_font_size all 0

# ---------------------------------------------------------------- colours (skwd-colors.conf overrides)
foreground              #cccccc
background              #0c0c0c
selection_foreground    #ffffff
selection_background    #264f78
cursor                  #ffffff
cursor_text_color       #0c0c0c
active_border_color     #3a3a3a
inactive_border_color   #1f1f1f
tab_bar_background      #1f1f1f
active_tab_foreground   #ffffff
active_tab_background   #0c0c0c
inactive_tab_foreground #9d9d9d
inactive_tab_background #1f1f1f

font_family      family="CaskaydiaMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto

include skwd-colors.conf

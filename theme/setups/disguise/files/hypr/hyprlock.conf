# Disguise's fallback lock screen (hyprlock), for when Disguise's own Quickshell lock isn't answering:
# Windows 11's sign-in screen. The desktop, blurred; the time and date large at the top; a round
# picture, your name and a rounded password box in the middle. Colours come from the theme
# (hyprlock-colors.conf, rewritten by ~/.config/theme/theme: it includes Disguise's own keys).
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

# Fallbacks until hyprlock-colors.conf exists (overridden by the source below)
$accent      = rgb(005fb8)
$danger      = rgb(c42b1c)

source = ~/.config/hypr/hyprlock-colors.conf

$ui          = Segoe UI Variable Static Text
$uiSemibold  = Segoe UI Variable Static Text Semibold
$big         = Segoe UI Variable Static Display Semibold
$icons       = Segoe Fluent Icons

general {
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = fluent, 0.1, 0.9, 0.2, 1
    animation = fadeIn, 1, 3, fluent
    animation = fadeOut, 1, 2, fluent
    animation = inputFieldDots, 1, 2, fluent
}

# the desktop, frosted (Windows blurs the lock picture behind the sign-in box)
background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 10
    noise = 0.02
    brightness = 0.7
    vibrancy = 0.2
}

# ---------------------------------------------------------------- time and date
label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M"
    color = rgba(ffffffff)
    font_size = 112
    font_family = $big
    position = 0, -90
    halign = center
    valign = top
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(00000055)
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(ffffffff)
    font_size = 22
    font_family = $ui
    position = 0, -250
    halign = center
    valign = top
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000055)
}

# ---------------------------------------------------------------- the account picture, name, password
shape {
    monitor =
    size = 176, 176
    color = rgba(ffffff26)
    rounding = -1
    border_size = 0
    position = 0, 90
    halign = center
    valign = center
}
label {
    monitor =
    text = 
    color = rgba(ffffffff)
    font_size = 64
    font_family = $icons
    position = 0, 90
    halign = center
    valign = center
}
label {
    monitor =
    text = $USER
    color = rgba(ffffffff)
    font_size = 26
    font_family = $uiSemibold
    position = 0, -30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 296, 36
    outline_thickness = 1
    rounding = 4
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = false
    dots_rounding = -1
    outer_color = rgba(ffffff40)
    inner_color = rgba(ffffffe6)
    font_color = rgb(1b1b1b)
    check_color = $accent
    fail_color = $danger
    fail_text = The password is incorrect. Try again.
    fail_timeout = 2500
    fade_on_empty = false
    placeholder_text = <span foreground="##5d5d5d">Password</span>
    font_family = $ui
    capslock_color = $warn
    position = 0, -90
    halign = center
    valign = center
}

label {
    monitor =
    text = Sign-in options
    color = rgba(ffffffcc)
    font_size = 11
    font_family = $ui
    position = 0, -140
    halign = center
    valign = center
}

# the corner icons: network and power, as on Windows' sign-in screen
label {
    monitor =
    text =           
    color = rgba(ffffffff)
    font_size = 16
    font_family = $icons
    position = -40, 36
    halign = right
    valign = bottom
}

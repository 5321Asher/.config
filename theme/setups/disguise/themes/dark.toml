# Windows (dark): Dark mode: charcoal Mica, the Bloom lit from behind.
name = "Windows (dark)"
appearance = "dark"
wallpaper = "disguise-dark-bloom.png"   # generated by wallpapers.py

[palette]
bg                  = "#202020"
bgDark              = "#1e1e1e"
surface             = "#2b2b2b"
hover               = "#323232"
border              = "#3a3a3a"
dim                 = "#9d9d9d"
fg                  = "#ffffff"
accent              = "#60cdff"
accentText          = "#000000"
accentMuted         = "#1f4a63"
purple              = "#0078d4"
warn                = "#fce100"
danger              = "#ff99a4"
green               = "#6ccb5f"
# Disguise's own: Windows 11's Fluent colour tokens (Quickshell and style.py read these)
mica                = "#202020"
micaAlt             = "#1c1c1c"
taskbar             = "#1c1c1c"
flyout              = "#2c2c2c"
card                = "#2b2b2b"
cardHover           = "#323232"
control             = "#2d2d2d"
controlHover        = "#323232"
controlPressed      = "#272727"
controlStroke       = "#363636"
controlStrokeBottom = "#2e2e2e"
cardStroke          = "#1d1d1d"
divider             = "#3a3a3a"
field               = "#1e1e1e"
text                = "#ffffff"
text2               = "#cfcfcf"
text3               = "#9d9d9d"
textDisabled        = "#717171"
strong              = "#9a9a9a"
accentHover         = "#5ab9e6"
accentPressed       = "#52a5cd"
accentLink          = "#99ebff"
desktop             = "#061433"
activeBorder        = "#474747"
inactiveBorder      = "#303030"

# Windows Terminal (Campbell): kitty, btop and Neovim stay dark, whatever the theme
[terminal]
bg          = "#0c0c0c"
bgDark      = "#0c0c0c"
surface     = "#1f1f1f"
hover       = "#2b2b2b"
border      = "#3a3a3a"
dim         = "#767676"
fg          = "#cccccc"
accent      = "#60cdff"
accentText  = "#000000"
accentMuted = "#264f78"
purple      = "#b4009e"
warn        = "#f9f1a5"
danger      = "#e74856"
green       = "#16c60c"

[terminal.syntax]
keyword   = "#569cd6"
function  = "#dcdcaa"
string    = "#ce9178"
type      = "#4ec9b0"
constant  = "#b5cea8"
property  = "#9cdcfe"
tag       = "#569cd6"
attribute = "#9cdcfe"
operator  = "#d4d4d4"
comment   = "#6a9955"

# Campbell, Windows Terminal's default scheme
[ansi]
black          = "#0c0c0c"
red            = "#c50f1f"
green          = "#13a10e"
yellow         = "#c19c00"
blue           = "#0037da"
magenta        = "#881798"
cyan           = "#3a96dd"
white          = "#cccccc"
bright_black   = "#767676"
bright_red     = "#e74856"
bright_green   = "#16c60c"
bright_yellow  = "#f9f1a5"
bright_blue    = "#3b78ff"
bright_magenta = "#b4009e"
bright_cyan    = "#61d6d6"
bright_white   = "#f2f2f2"

# Visual Studio Code's Dark+
[syntax]
keyword   = "#569cd6"
function  = "#dcdcaa"
string    = "#ce9178"
type      = "#4ec9b0"
constant  = "#b5cea8"
property  = "#9cdcfe"
tag       = "#569cd6"
attribute = "#9cdcfe"
operator  = "#d4d4d4"
comment   = "#6a9955"

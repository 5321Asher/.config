# Flow: Deep water: teal light on a blue-black Mica.
name = "Flow"
appearance = "dark"
wallpaper = "disguise-flow-bloom.png"   # generated by wallpapers.py

[palette]
bg                  = "#1b2023"
bgDark              = "#191e21"
surface             = "#252c30"
hover               = "#2f383c"
border              = "#353f44"
dim                 = "#9d9d9d"
fg                  = "#ffffff"
accent              = "#52d6c1"
accentText          = "#000000"
accentMuted         = "#1a4943"
purple              = "#00b294"
warn                = "#fce100"
danger              = "#ff99a4"
green               = "#6ccb5f"
# Disguise's own: Windows 11's Fluent colour tokens (Quickshell and style.py read these)
mica                = "#1b2023"
micaAlt             = "#171c1f"
taskbar             = "#171c1f"
flyout              = "#262d31"
card                = "#252c30"
cardHover           = "#2d3539"
control             = "#283034"
controlHover        = "#2f383c"
controlPressed      = "#232a2e"
controlStroke       = "#343d42"
controlStrokeBottom = "#2b3337"
cardStroke          = "#1d1d1d"
divider             = "#353f44"
field               = "#191e21"
text                = "#ffffff"
text2               = "#cfcfcf"
text3               = "#9d9d9d"
textDisabled        = "#717171"
strong              = "#9a9a9a"
accentHover         = "#4bc2b0"
accentPressed       = "#43ad9d"
accentLink          = "#9df2e4"
desktop             = "#04141a"
activeBorder        = "#43505a"
inactiveBorder      = "#2c3438"

# Windows Terminal (Campbell): kitty, btop and Neovim stay dark, whatever the theme
[terminal]
bg          = "#0c0c0c"
bgDark      = "#0c0c0c"
surface     = "#1f1f1f"
hover       = "#2b2b2b"
border      = "#3a3a3a"
dim         = "#767676"
fg          = "#cccccc"
accent      = "#52d6c1"
accentText  = "#000000"
accentMuted = "#264f78"
purple      = "#b4009e"
warn        = "#f9f1a5"
danger      = "#e74856"
green       = "#16c60c"

[terminal.syntax]
keyword   = "#569cd6"
function  = "#dcdcaa"
string    = "#ce9178"
type      = "#4ec9b0"
constant  = "#b5cea8"
property  = "#9cdcfe"
tag       = "#569cd6"
attribute = "#9cdcfe"
operator  = "#d4d4d4"
comment   = "#6a9955"

# Campbell, Windows Terminal's default scheme
[ansi]
black          = "#0c0c0c"
red            = "#c50f1f"
green          = "#13a10e"
yellow         = "#c19c00"
blue           = "#0037da"
magenta        = "#881798"
cyan           = "#3a96dd"
white          = "#cccccc"
bright_black   = "#767676"
bright_red     = "#e74856"
bright_green   = "#16c60c"
bright_yellow  = "#f9f1a5"
bright_blue    = "#3b78ff"
bright_magenta = "#b4009e"
bright_cyan    = "#61d6d6"
bright_white   = "#f2f2f2"

# Visual Studio Code's Dark+
[syntax]
keyword   = "#569cd6"
function  = "#dcdcaa"
string    = "#ce9178"
type      = "#4ec9b0"
constant  = "#b5cea8"
property  = "#9cdcfe"
tag       = "#569cd6"
attribute = "#9cdcfe"
operator  = "#d4d4d4"
comment   = "#6a9955"

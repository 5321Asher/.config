# Sunrise: Warm light: cream Mica, an amber Bloom.
name = "Sunrise"
appearance = "light"
wallpaper = "disguise-sunrise-bloom.png"   # generated by wallpapers.py

[palette]
bg                  = "#f5f1ee"
bgDark              = "#ffffff"
surface             = "#fcfaf8"
hover               = "#f7f2ee"
border              = "#e8e1db"
dim                 = "#8a8a8a"
fg                  = "#1b1b1b"
accent              = "#b5470d"
accentText          = "#ffffff"
accentMuted         = "#f6dccb"
purple              = "#ca5010"
warn                = "#9d5d00"
danger              = "#c42b1c"
green               = "#0f7b0f"
# Disguise's own: Windows 11's Fluent colour tokens (Quickshell and style.py read these)
mica                = "#f5f1ee"
micaAlt             = "#f0ebe7"
taskbar             = "#f0ebe7"
flyout              = "#fbf8f6"
card                = "#fcfaf8"
cardHover           = "#f7f3f0"
control             = "#fefcfb"
controlHover        = "#f7f2ee"
controlPressed      = "#f3eee9"
controlStroke       = "#e7e0da"
controlStrokeBottom = "#cfc6be"
cardStroke          = "#e8e1db"
divider             = "#e8e1db"
field               = "#ffffff"
text                = "#1b1b1b"
text2               = "#5d5d5d"
text3               = "#8a8a8a"
textDisabled        = "#a0a0a0"
strong              = "#8a8a8a"
accentHover         = "#bd5823"
accentPressed       = "#c46a3a"
accentLink          = "#7d2e05"
desktop             = "#fbe9da"
activeBorder        = "#cdc3bb"
inactiveBorder      = "#ddd5ce"

# Windows Terminal (Campbell): kitty, btop and Neovim stay dark, whatever the theme
[terminal]
bg          = "#0c0c0c"
bgDark      = "#0c0c0c"
surface     = "#1f1f1f"
hover       = "#2b2b2b"
border      = "#3a3a3a"
dim         = "#767676"
fg          = "#cccccc"
accent      = "#ca5010"
accentText  = "#ffffff"
accentMuted = "#264f78"
purple      = "#b4009e"
warn        = "#f9f1a5"
danger      = "#e74856"
green       = "#16c60c"

[terminal.syntax]
keyword   = "#569cd6"
function  = "#dcdcaa"
string    = "#ce9178"
type      = "#4ec9b0"
constant  = "#b5cea8"
property  = "#9cdcfe"
tag       = "#569cd6"
attribute = "#9cdcfe"
operator  = "#d4d4d4"
comment   = "#6a9955"

# Campbell, Windows Terminal's default scheme
[ansi]
black          = "#0c0c0c"
red            = "#c50f1f"
green          = "#13a10e"
yellow         = "#c19c00"
blue           = "#0037da"
magenta        = "#881798"
cyan           = "#3a96dd"
white          = "#cccccc"
bright_black   = "#767676"
bright_red     = "#e74856"
bright_green   = "#16c60c"
bright_yellow  = "#f9f1a5"
bright_blue    = "#3b78ff"
bright_magenta = "#b4009e"
bright_cyan    = "#61d6d6"
bright_white   = "#f2f2f2"

# Visual Studio Code's Light+
[syntax]
keyword   = "#0000ff"
function  = "#795e26"
string    = "#a31515"
type      = "#267f99"
constant  = "#098658"
property  = "#001080"
tag       = "#800000"
attribute = "#e50000"
operator  = "#000000"
comment   = "#008000"

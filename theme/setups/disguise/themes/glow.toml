# Glow: Violet light on black, and a plum-tinted Mica.
name = "Glow"
appearance = "dark"
wallpaper = "disguise-glow-bloom.png"   # generated by wallpapers.py

[palette]
bg                  = "#211d27"
bgDark              = "#1d1a22"
surface             = "#2b2731"
hover               = "#352f3d"
border              = "#3c3645"
dim                 = "#9d9d9d"
fg                  = "#ffffff"
accent              = "#c3a6ff"
accentText          = "#000000"
accentMuted         = "#3e3059"
purple              = "#8764b8"
warn                = "#fce100"
danger              = "#ff99a4"
green               = "#6ccb5f"
# Disguise's own: Windows 11's Fluent colour tokens (Quickshell and style.py read these)
mica                = "#211d27"
micaAlt             = "#1c1922"
taskbar             = "#1c1922"
flyout              = "#2c2733"
card                = "#2b2731"
cardHover           = "#332e3a"
control             = "#2e2935"
controlHover        = "#352f3d"
controlPressed      = "#28232e"
controlStroke       = "#3a3442"
controlStrokeBottom = "#302a37"
cardStroke          = "#1d1d1d"
divider             = "#3c3645"
field               = "#1d1a22"
text                = "#ffffff"
text2               = "#cfcfcf"
text3               = "#9d9d9d"
textDisabled        = "#717171"
strong              = "#9a9a9a"
accentHover         = "#b297e8"
accentPressed       = "#a088d1"
accentLink          = "#e2d3ff"
desktop             = "#0e0718"
activeBorder        = "#4b4356"
inactiveBorder      = "#312c38"

# Windows Terminal (Campbell): kitty, btop and Neovim stay dark, whatever the theme
[terminal]
bg          = "#0c0c0c"
bgDark      = "#0c0c0c"
surface     = "#1f1f1f"
hover       = "#2b2b2b"
border      = "#3a3a3a"
dim         = "#767676"
fg          = "#cccccc"
accent      = "#c3a6ff"
accentText  = "#000000"
accentMuted = "#264f78"
purple      = "#b4009e"
warn        = "#f9f1a5"
danger      = "#e74856"
green       = "#16c60c"

[terminal.syntax]
keyword   = "#569cd6"
function  = "#dcdcaa"
string    = "#ce9178"
type      = "#4ec9b0"
constant  = "#b5cea8"
property  = "#9cdcfe"
tag       = "#569cd6"
attribute = "#9cdcfe"
operator  = "#d4d4d4"
comment   = "#6a9955"

# Campbell, Windows Terminal's default scheme
[ansi]
black          = "#0c0c0c"
red            = "#c50f1f"
green          = "#13a10e"
yellow         = "#c19c00"
blue           = "#0037da"
magenta        = "#881798"
cyan           = "#3a96dd"
white          = "#cccccc"
bright_black   = "#767676"
bright_red     = "#e74856"
bright_green   = "#16c60c"
bright_yellow  = "#f9f1a5"
bright_blue    = "#3b78ff"
bright_magenta = "#b4009e"
bright_cyan    = "#61d6d6"
bright_white   = "#f2f2f2"

# Visual Studio Code's Dark+
[syntax]
keyword   = "#569cd6"
function  = "#dcdcaa"
string    = "#ce9178"
type      = "#4ec9b0"
constant  = "#b5cea8"
property  = "#9cdcfe"
tag       = "#569cd6"
attribute = "#9cdcfe"
operator  = "#d4d4d4"
comment   = "#6a9955"

# Windows (light): The one it comes with: light Mica, the blue Bloom.
name = "Windows (light)"
appearance = "light"
wallpaper = "disguise-light-bloom.png"   # generated by wallpapers.py

[palette]
bg                  = "#f3f3f3"
bgDark              = "#ffffff"
surface             = "#fbfbfb"
hover               = "#f6f6f6"
border              = "#e5e5e5"
dim                 = "#8a8a8a"
fg                  = "#1b1b1b"
accent              = "#005fb8"
accentText          = "#ffffff"
accentMuted         = "#cce2f6"
purple              = "#0078d4"
warn                = "#9d5d00"
danger              = "#c42b1c"
green               = "#0f7b0f"
# Disguise's own: Windows 11's Fluent colour tokens (Quickshell and style.py read these)
mica                = "#f3f3f3"
micaAlt             = "#eeeeee"
taskbar             = "#eeeeee"
flyout              = "#f9f9f9"
card                = "#fbfbfb"
cardHover           = "#f6f6f6"
control             = "#fdfdfd"
controlHover        = "#f6f6f6"
controlPressed      = "#f2f2f2"
controlStroke       = "#e3e3e3"
controlStrokeBottom = "#c9c9c9"
cardStroke          = "#e5e5e5"
divider             = "#e5e5e5"
field               = "#ffffff"
text                = "#1b1b1b"
text2               = "#5d5d5d"
text3               = "#8a8a8a"
textDisabled        = "#a0a0a0"
strong              = "#8a8a8a"
accentHover         = "#1a6ec0"
accentPressed       = "#327dc6"
accentLink          = "#003e92"
desktop             = "#dbe6f4"
activeBorder        = "#c7c7c7"
inactiveBorder      = "#d9d9d9"

# Windows Terminal (Campbell): kitty, btop and Neovim stay dark, whatever the theme
[terminal]
bg          = "#0c0c0c"
bgDark      = "#0c0c0c"
surface     = "#1f1f1f"
hover       = "#2b2b2b"
border      = "#3a3a3a"
dim         = "#767676"
fg          = "#cccccc"
accent      = "#0078d4"
accentText  = "#ffffff"
accentMuted = "#264f78"
purple      = "#b4009e"
warn        = "#f9f1a5"
danger      = "#e74856"
green       = "#16c60c"

[terminal.syntax]
keyword   = "#569cd6"
function  = "#dcdcaa"
string    = "#ce9178"
type      = "#4ec9b0"
constant  = "#b5cea8"
property  = "#9cdcfe"
tag       = "#569cd6"
attribute = "#9cdcfe"
operator  = "#d4d4d4"
comment   = "#6a9955"

# Campbell, Windows Terminal's default scheme
[ansi]
black          = "#0c0c0c"
red            = "#c50f1f"
green          = "#13a10e"
yellow         = "#c19c00"
blue           = "#0037da"
magenta        = "#881798"
cyan           = "#3a96dd"
white          = "#cccccc"
bright_black   = "#767676"
bright_red     = "#e74856"
bright_green   = "#16c60c"
bright_yellow  = "#f9f1a5"
bright_blue    = "#3b78ff"
bright_magenta = "#b4009e"
bright_cyan    = "#61d6d6"
bright_white   = "#f2f2f2"

# Visual Studio Code's Light+
[syntax]
keyword   = "#0000ff"
function  = "#795e26"
string    = "#a31515"
type      = "#267f99"
constant  = "#098658"
property  = "#001080"
tag       = "#800000"
attribute = "#e50000"
operator  = "#000000"
comment   = "#008000"

# Captured Motion: Crimson ribbons in the dark, a rose accent.
name = "Captured Motion"
appearance = "dark"
wallpaper = "disguise-captured-motion-bloom.png"   # generated by wallpapers.py

[palette]
bg                  = "#221c1e"
bgDark              = "#1e191a"
surface             = "#2d2628"
hover               = "#372f32"
border              = "#3f3538"
dim                 = "#9d9d9d"
fg                  = "#ffffff"
accent              = "#ff9eb5"
accentText          = "#000000"
accentMuted         = "#5a2a37"
purple              = "#e3004f"
warn                = "#fce100"
danger              = "#ff99a4"
green               = "#6ccb5f"
# Disguise's own: Windows 11's Fluent colour tokens (Quickshell and style.py read these)
mica                = "#221c1e"
micaAlt             = "#1d1819"
taskbar             = "#1d1819"
flyout              = "#2e2729"
card                = "#2d2628"
cardHover           = "#352d30"
control             = "#30282b"
controlHover        = "#372f32"
controlPressed      = "#292224"
controlStroke       = "#3d3336"
controlStrokeBottom = "#32292c"
cardStroke          = "#1d1d1d"
divider             = "#3f3538"
field               = "#1e191a"
text                = "#ffffff"
text2               = "#cfcfcf"
text3               = "#9d9d9d"
textDisabled        = "#717171"
strong              = "#9a9a9a"
accentHover         = "#e88fa4"
accentPressed       = "#d18093"
accentLink          = "#ffd2dc"
desktop             = "#16060b"
activeBorder        = "#54444a"
inactiveBorder      = "#342b2e"

# Windows Terminal (Campbell): kitty, btop and Neovim stay dark, whatever the theme
[terminal]
bg          = "#0c0c0c"
bgDark      = "#0c0c0c"
surface     = "#1f1f1f"
hover       = "#2b2b2b"
border      = "#3a3a3a"
dim         = "#767676"
fg          = "#cccccc"
accent      = "#ff9eb5"
accentText  = "#000000"
accentMuted = "#264f78"
purple      = "#b4009e"
warn        = "#f9f1a5"
danger      = "#e74856"
green       = "#16c60c"

[terminal.syntax]
keyword   = "#569cd6"
function  = "#dcdcaa"
string    = "#ce9178"
type      = "#4ec9b0"
constant  = "#b5cea8"
property  = "#9cdcfe"
tag       = "#569cd6"
attribute = "#9cdcfe"
operator  = "#d4d4d4"
comment   = "#6a9955"

# Campbell, Windows Terminal's default scheme
[ansi]
black          = "#0c0c0c"
red            = "#c50f1f"
green          = "#13a10e"
yellow         = "#c19c00"
blue           = "#0037da"
magenta        = "#881798"
cyan           = "#3a96dd"
white          = "#cccccc"
bright_black   = "#767676"
bright_red     = "#e74856"
bright_green   = "#16c60c"
bright_yellow  = "#f9f1a5"
bright_blue    = "#3b78ff"
bright_magenta = "#b4009e"
bright_cyan    = "#61d6d6"
bright_white   = "#f2f2f2"

# Visual Studio Code's Dark+
[syntax]
keyword   = "#569cd6"
function  = "#dcdcaa"
string    = "#ce9178"
type      = "#4ec9b0"
constant  = "#b5cea8"
property  = "#9cdcfe"
tag       = "#569cd6"
attribute = "#9cdcfe"
operator  = "#d4d4d4"
comment   = "#6a9955"

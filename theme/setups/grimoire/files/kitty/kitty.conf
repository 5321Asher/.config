# ~/.config/kitty/kitty.conf (Grimoire)
# A page of the grimoire: parchment-toned text on dark leather (a touch see-through, blurred), IBM Plex
# Mono (its slab serifs read like a typewritten page), a gold quill for a cursor that trails a little
# ink, generous margins, and tabs set like a book's running head:  I · zsh  ❧  II · nvim
# Colours and the font come from the theme (skwd-colors.conf, included at the end).
# Reload anytime: ctrl+shift+f5

# ─── Font ───────────────────────────────────────────────
font_size        12.5
modify_font      cell_height 122%
modify_font      baseline 1
disable_ligatures cursor
# Nerd Font icons (prompts, ls) come from JetBrains Mono's Nerd Font build
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD JetBrainsMono Nerd Font Mono

# ─── Cursor: the quill ──────────────────────────────────
cursor_shape               beam
cursor_beam_thickness      2
cursor_blink_interval      0.7 ease-in-out
cursor_stop_blinking_after 15.0
cursor_trail               5
cursor_trail_decay         0.12 0.5
cursor_trail_start_threshold 3

# ─── Window: the page ───────────────────────────────────
window_padding_width      18 26
placement_strategy        center
remember_window_size      yes
initial_window_width      112c
initial_window_height     32c
confirm_os_window_close   0
background_opacity        0.93
background_blur           32
dynamic_background_opacity yes

# Splits: a hairline of tooling between them
enabled_layouts           splits,stack
window_border_width       1pt
draw_minimal_borders      yes
inactive_text_alpha       0.7

# ─── Tabs: the running head ─────────────────────────────
tab_bar_edge              top
tab_bar_align             center
tab_bar_margin_height     6.0 10.0
tab_bar_style             separator
tab_separator             "  ❧  "
tab_bar_min_tabs          2
tab_title_template        "{index} · {title}"
active_tab_font_style     bold-italic
inactive_tab_font_style   italic

# ─── Behavior ───────────────────────────────────────────
scrollback_lines          10000
copy_on_select            yes
strip_trailing_spaces     smart
url_style                 curly
detect_urls               yes
enable_audio_bell         no
visual_bell_duration      0.0
shell_integration         enabled
sync_to_monitor           yes

# ─── Keybindings ────────────────────────────────────────
map ctrl+shift+enter      launch --location=hsplit --cwd=current
map ctrl+shift+backslash  launch --location=vsplit --cwd=current
map ctrl+shift+t          new_tab_with_cwd

map ctrl+alt+h            neighboring_window left
map ctrl+alt+l            neighboring_window right
map ctrl+alt+k            neighboring_window up
map ctrl+alt+j            neighboring_window down

map ctrl+shift+z          toggle_layout stack

map ctrl+equal            change_font_size all +1.0
map ctrl+minus            change_font_size all -1.0
map ctrl+0                change_font_size all 0

map ctrl+shift+a>m        set_background_opacity +0.05
map ctrl+shift+a>l        set_background_opacity -0.05
map ctrl+shift+a>1        set_background_opacity 1
map ctrl+shift+a>d        set_background_opacity default

# ─── Colours: from the theme ────────────────────────────
include skwd-colors.conf

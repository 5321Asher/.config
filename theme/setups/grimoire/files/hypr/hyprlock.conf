# Grimoire's fallback lock screen (hyprlock), for when Grimoire's own Quickshell lock (the closed
# book) isn't answering: the desk blurred into candlelight, the book's title in blackletter gold, the
# hour, and "speak the word" on a gilt line. Colours and fonts come from the theme:
# hyprlock-colors.conf is rewritten by ~/.config/theme/theme.
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

$font        = monospace
$fontDisplay = serif

$bgDark      = rgb(190b0b)
$fg          = rgb(e8dcc0)
$dim         = rgb(a8957a)
$accent      = rgb(c9a24a)
$purple      = rgb(9b7fe0)
$danger      = rgb(c4453a)
$border      = rgb(5e3e28)
$goldBright  = rgb(f2d98c)

source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = arcane, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 6, arcane
    animation = fadeOut, 1, 4, arcane
}

background {
    monitor =
    path = screenshot
    color = $bgDark
    blur_passes = 4
    blur_size = 8
    brightness = 0.38
    contrast = 0.9
    vibrancy = 0.1
}

label {
    monitor =
    text = Grimoire
    color = $accent
    font_size = 96
    font_family = $fontDisplay
    position = 0, 190
    halign = center
    valign = center
}
label {
    monitor =
    text = ✦   ❦   ✦
    color = $border
    font_size = 16
    font_family = Noto Sans Symbols 2
    position = 0, 95
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M"
    color = $fg
    font_size = 54
    font_family = Cardo
    position = 0, 30
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, the %-d of %B"
    color = $dim
    font_size = 15
    font_family = Cardo
    position = 0, -28
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 420, 50
    rounding = 3
    outline_thickness = 1
    outer_color = $accent
    inner_color = rgba(190b0bcc)
    font_color = $goldBright
    check_color = $purple
    fail_color = $danger
    capslock_color = $purple
    font_family = Cardo
    placeholder_text = <i>speak the word</i>
    fail_text = <i>the word is not known</i>
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.6
    dots_center = true
    dots_rounding = -1
    position = 0, -110
    halign = center
    valign = center
}

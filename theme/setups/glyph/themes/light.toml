# Light: the same layout with the greys turned round; the red doesn't change.
name = "Light"
appearance = "light"
wallpaper = "glyph-light-dots.png"

[palette]
bg          = "#E9E9E9"
bgDark      = "#E9E9E9"
surface     = "#FFFFFF"
hover       = "#F1F1F1"
border      = "#D9D9D9"
dim         = "#6E6E6E"
fg          = "#0B0B0B"
accent      = "#0B0B0B"
accentText  = "#FFFFFF"
accentMuted = "#D9D9D9"
purple      = "#D71921"
warn        = "#9A7B2E"
danger      = "#D71921"
green       = "#4F7A4E"
s1             = "#FFFFFF"
s2             = "#F1F1F1"
s3             = "#D9D9D9"
mute           = "#B8B8B8"
grey           = "#6E6E6E"
ink            = "#FFFFFF"
red            = "#D71921"
activeBorder   = "#0B0B0B"
inactiveBorder = "#D9D9D9"

[terminal]
bg     = "#FFFFFF"
bgDark = "#FFFFFF"
purple = "#6E6E6E"

# the reference swaps 0↔15 and 7↔8 for light; the pastels are deepened so they read on white
[ansi]
black          = "#0B0B0B"
red            = "#D71921"
green          = "#4F7A4E"
yellow         = "#9A7B2E"
blue           = "#4A6690"
magenta        = "#7E5A8C"
cyan           = "#3F7C7C"
white          = "#6E6E6E"
bright_black   = "#8C8C8C"
bright_red     = "#B3141B"
bright_green   = "#3E643D"
bright_yellow  = "#7D6324"
bright_blue    = "#3A5378"
bright_magenta = "#674875"
bright_cyan    = "#2F6464"
bright_white   = "#0E0E0E"

[syntax]
keyword   = "#0B0B0B"
function  = "#3A3A3A"
string    = "#4F7A4E"
type      = "#4A6690"
constant  = "#9A7B2E"
property  = "#7E5A8C"
tag       = "#D71921"
attribute = "#3F7C7C"
operator  = "#6E6E6E"
comment   = "#9A9A9A"

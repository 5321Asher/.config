# Glyph's fallback lock (hyprlock): only used if Glyph's own Quickshell lock isn't answering
# (setup.toml: lock = "qs ipc call lock lock || … || hyprlock"). The same face, simpler: the clock
# in Doto across the screen, the date as a tracked label, the password pill with white dots.
$font        = Space Mono
$fontDisplay = Doto
$bg          = rgb(000000)
$s1          = rgb(0e0e0e)
$s3          = rgb(2a2a2a)
$fg          = rgb(f2f2f2)
$grey        = rgb(8c8c8c)
$red         = rgb(d71921)

source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = glide, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 4, glide
    animation = fadeOut, 1, 3, glide
}

background {
    monitor =
    color = $bg
}

label {
    monitor =
    text = cmd[update:60000] date +"%A  ·  %-d %B" | tr a-z A-Z
    color = $grey
    font_size = 12
    font_family = $font
    position = 0, -150
    halign = center
    valign = top
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $fg
    font_size = 210
    font_family = $fontDisplay Black
    position = 0, -210
    halign = center
    valign = top
}
label {
    monitor =
    text = $USER
    color = $fg
    font_size = 16
    font_family = Space Grotesk
    position = 0, 200
    halign = center
    valign = bottom
}
input-field {
    monitor =
    size = 380, 58
    outline_thickness = 1
    rounding = -1
    dots_size = 0.2
    dots_spacing = 0.6
    dots_center = true
    outer_color = $s3
    inner_color = $s1
    font_color = $fg
    check_color = $fg
    fail_color = $red
    fade_on_empty = false
    placeholder_text = <span foreground="##4a4a4a">ENTER PASSWORD</span>
    fail_text = <span foreground="##d71921">WRONG PASSWORD · TRY AGAIN</span>
    font_family = $font
    position = 0, 120
    halign = center
    valign = bottom
}

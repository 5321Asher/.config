# Glyph's kitty: Space Mono on near-black (the theme writes the colours and the font into
# skwd-colors.conf), roomy padding as in the reference, no blur, and a tab bar of pills
# (tab_bar.py): the active tab white with ink text and its number in front.

font_size        11.5
modify_font      cell_height 112%
disable_ligatures cursor

cursor_shape               block
cursor_blink_interval      0
cursor_trail               0

window_padding_width      26 30
placement_strategy        center
remember_window_size      yes
initial_window_width      110c
initial_window_height     32c
confirm_os_window_close   0

background_opacity        1
dynamic_background_opacity yes

enabled_layouts           splits,stack
window_border_width       1pt
draw_minimal_borders      yes
inactive_text_alpha       0.7

tab_bar_edge              bottom
tab_bar_align             left
tab_bar_margin_height     6.0 10.0
tab_bar_margin_width      12.0
tab_bar_style             custom
tab_bar_min_tabs          2
tab_title_template        "{title}"

scrollback_lines          10000
copy_on_select            yes
strip_trailing_spaces     smart
url_style                 dotted
detect_urls               yes
enable_audio_bell         no
visual_bell_duration      0.0
shell_integration         enabled
sync_to_monitor           yes

map ctrl+shift+enter      launch --location=hsplit --cwd=current
map ctrl+shift+backslash  launch --location=vsplit --cwd=current
map ctrl+shift+t          new_tab_with_cwd
map ctrl+alt+h            neighboring_window left
map ctrl+alt+l            neighboring_window right
map ctrl+alt+k            neighboring_window up
map ctrl+alt+j            neighboring_window down
map ctrl+shift+z          toggle_layout stack
map ctrl+equal            change_font_size all +1.0
map ctrl+minus            change_font_size all -1.0
map ctrl+0                change_font_size all 0

# fallback colours (Dark); the theme's come after
foreground              #F2F2F2
background              #0E0E0E
selection_foreground    #F2F2F2
selection_background    #2A2A2A
url_color               #8C8C8C
cursor                  #F2F2F2

include skwd-colors.conf

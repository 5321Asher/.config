# Observatory: the control panel of a deep-space observatory. Brass instruments, phosphor readouts,
# arcs and orbits instead of boxes.
name = "Observatory"
description = "brass · orbits · phosphor"
default_theme = "deep-field"
icon = "󰥔"

# Run by `theme lock` (hypridle's lock_cmd, SUPER+L, Power → Lock). The Quickshell lock screen;
# hyprlock if Observatory's Quickshell isn't answering.
lock = "qs ipc call lock lock || pidof hyprlock || hyprlock"

# JetBrains Mono for data (and everything else, system-wide); Cormorant Garamond for labels.
[fonts]
mono    = "JetBrainsMono Nerd Font"
sans    = "JetBrainsMono Nerd Font"
serif   = "Cormorant Garamond"
display = "Cormorant Garamond"
size    = 10

[cursor]
theme = "Adwaita"
size  = 24

[hyprland]
border = "accent"   # one brass line, no gradient

# What SUPER + Space and SUPER + CTRL + Space open here (~/.config/theme/menu). Other setups: Walker.
[menus]
root = "qs ipc call console toggle"
apps = "qs ipc call starchart toggle"

# How switching to this setup, or between its themes, is revealed: fade | wipe | iris (ms)
# (a circle opening from the centre, edged with a ring in the new accent (the dome shutter))
[transition]
style    = "iris"
duration = 900

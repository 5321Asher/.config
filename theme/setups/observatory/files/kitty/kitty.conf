# ~/.config/kitty/kitty.conf
# Sleek, modern kitty setup — Tokyo Night palette
# Reload anytime: ctrl+shift+f5 (Linux) / cmd+ctrl+, (macOS)

# ─── Font ───────────────────────────────────────────────
# Find your exact font name with:  kitty +list-fonts | grep -i nerd
# font_family      Adiwata Nerd Font
# bold_font        auto
# italic_font      auto
# bold_italic_font auto
font_size        12.0
modify_font      cell_height 118%
disable_ligatures cursor

# ─── Cursor ─────────────────────────────────────────────
cursor_shape               beam
cursor_beam_thickness      1.8
cursor_blink_interval      0.5
cursor_stop_blinking_after 10.0
# Smooth animated trail when the cursor jumps (kitty 0.37+)
cursor_trail               3
cursor_trail_decay         0.1 0.4

# ─── Window ─────────────────────────────────────────────
window_padding_width      18 24
placement_strategy        center
remember_window_size      yes
initial_window_width      120c
initial_window_height     34c
confirm_os_window_close   0
# Opaque: with any transparency, kitty paints its background over only part of the window on a
# monitor scaled below 1 (the portrait one at 0.833), and the rest shows through
background_opacity        1
# Blur behind the window (macOS, KDE, and some Wayland compositors)
background_blur           0
dynamic_background_opacity yes

# Splits
enabled_layouts           splits,stack
window_border_width       0.5pt
draw_minimal_borders      yes
inactive_text_alpha       0.75

# ─── Tab bar ────────────────────────────────────────────
tab_bar_edge              top
tab_bar_margin_height     6.0 0.0
tab_bar_style             separator
tab_powerline_style       slanted
tab_bar_min_tabs          2
tab_title_template        " {index}  {title} "
active_tab_font_style     bold
inactive_tab_font_style   normal

# ─── Behavior ───────────────────────────────────────────
scrollback_lines          10000
copy_on_select            yes
strip_trailing_spaces     smart
url_style                 curly
detect_urls               yes
enable_audio_bell         no
visual_bell_duration      0.0
shell_integration         enabled
sync_to_monitor           yes

# ─── Keybindings ────────────────────────────────────────
# Splits (open in the current directory)
map ctrl+shift+enter      launch --location=hsplit --cwd=current
map ctrl+shift+backslash  launch --location=vsplit --cwd=current
map ctrl+shift+t          new_tab_with_cwd

# Move between splits
map ctrl+alt+h            neighboring_window left
map ctrl+alt+l            neighboring_window right
map ctrl+alt+k            neighboring_window up
map ctrl+alt+j            neighboring_window down

# Zoom the current split to full window and back
map ctrl+shift+z          toggle_layout stack

# Font size
map ctrl+equal            change_font_size all +1.0
map ctrl+minus            change_font_size all -1.0
map ctrl+0                change_font_size all 0

# Transparency on the fly
map ctrl+shift+a>m        set_background_opacity +0.05
map ctrl+shift+a>l        set_background_opacity -0.05
map ctrl+shift+a>1        set_background_opacity 1
map ctrl+shift+a>d        set_background_opacity default

# ─── OS-specific ────────────────────────────────────────
# macOS: uncomment these
# hide_window_decorations          titlebar-only
# macos_titlebar_color             background
# macos_option_as_alt              yes
# macos_show_window_title_in       none
# macos_quit_when_last_window_closed yes

# Linux: uncomment to drop the title bar entirely
# hide_window_decorations          yes
# linux_display_server             auto

# ─── Colors: Tokyo Night ────────────────────────────────
foreground              #c0caf5
background              #1a1b26
selection_foreground    #c0caf5
selection_background    #283457
url_color               #73daca
cursor                  #c0caf5
cursor_text_color       #1a1b26

active_border_color     #7aa2f7
inactive_border_color   #292e42
bell_border_color       #e0af68

tab_bar_background      #15161e
active_tab_foreground   #16161e
active_tab_background   #7aa2f7
inactive_tab_foreground #545c7e
inactive_tab_background #292e42

# black
color0  #15161e
color8  #414868
# red
color1  #f7768e
color9  #f7768e
# green
color2  #9ece6a
color10 #9ece6a
# yellow
color3  #e0af68
color11 #e0af68
# blue
color4  #7aa2f7
color12 #7aa2f7
# magenta
color5  #bb9af7
color13 #bb9af7
# cyan
color6  #7dcfff
color14 #7dcfff
# white
color7  #a9b1d6
color15 #c0caf5



# BEGIN_KITTY_FONTS
font_family      family="CaskaydiaMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# Wallpaper colours (generated by ~/.config/quickshell/scripts/wallpaper-colors.py)
include skwd-colors.conf

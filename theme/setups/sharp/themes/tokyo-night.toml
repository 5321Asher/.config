# Theme file. [palette] drives every app's UI; [ansi] is the terminal palette (kitty, Zed's terminal,
# starship); [syntax] colours code in Zed and Neovim. Anything left out is derived.
# Wallpapers for this theme live in ~/Pictures/Wallpaper-Themes/tokyo-night/
name = "Tokyo Night"
appearance = "dark"
native_nvim = true          # Neovim uses stock tokyonight instead of a recolour
# wallpaper = "file.jpg"    # applied the first time you switch here (else: last used / random)

[palette]
bg          = "#1a1b26"
bgDark      = "#16161e"
surface     = "#292e42"
hover       = "#3b4261"
border      = "#414868"
dim         = "#565f89"
fg          = "#c0caf5"
accent      = "#7aa2f7"
accentText  = "#16161e"
accentMuted = "#3d59a1"
purple      = "#bb9af7"   # second accent (border gradient, links, seeding...)
warn        = "#e0af68"
danger      = "#f7768e"
green       = "#9ece6a"

[ansi]
black   = "#15161e"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"
bright_black = "#414868"
bright_white = "#c0caf5"

[syntax]
keyword   = "#bb9af7"
function  = "#7aa2f7"
string    = "#9ece6a"
type      = "#2ac3de"
constant  = "#ff9e64"
property  = "#73daca"
tag       = "#f7768e"
attribute = "#bb9af7"
operator  = "#89ddff"
comment   = "#565f89"

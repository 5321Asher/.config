# White: warm off-white paper, ink text, a clear blue accent and violet second colour.
name = "Paper"
appearance = "light"

[palette]
bg          = "#f7f6f2"
bgDark      = "#ebe9e3"
surface     = "#e3e0d8"
hover       = "#d8d4ca"
border      = "#c9c5ba"
dim         = "#8b877d"
fg          = "#26251f"
accent      = "#2563eb"
accentText  = "#ffffff"
accentMuted = "#c2d3f7"
purple      = "#8b3fd9"   # second accent: violet
warn        = "#b26b00"
danger      = "#d0312d"
green       = "#2f8a3e"

[ansi]
black   = "#26251f"
red     = "#c62828"
green   = "#2e7d32"
yellow  = "#9a6700"
blue    = "#1f5fc4"
magenta = "#8b3fd9"
cyan    = "#0f7a84"
white   = "#6e6b63"
bright_black   = "#8b877d"
bright_red     = "#e53935"
bright_green   = "#43a047"
bright_yellow  = "#b88600"
bright_blue    = "#2563eb"
bright_magenta = "#a35ae6"
bright_cyan    = "#1596a0"
bright_white   = "#8b877d"

[syntax]
keyword   = "#a626a4"
function  = "#2563eb"
string    = "#3f8f3a"
type      = "#b36b00"
constant  = "#b5540a"
property  = "#c7372f"
tag       = "#c7372f"
attribute = "#9a6700"
operator  = "#0f7a84"
comment   = "#9d998f"

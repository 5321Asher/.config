# Red: near-black with a wine undertone, crimson accent, ember orange as the second colour.
name = "Crimson"
appearance = "dark"

[palette]
bg          = "#150b0d"
bgDark      = "#0e0708"
surface     = "#241316"
hover       = "#331b1f"
border      = "#4a252b"
dim         = "#86585e"
fg          = "#f1dede"
accent      = "#e5334b"
accentText  = "#150b0d"
accentMuted = "#6b1a26"
purple      = "#ff8a57"   # second accent: ember
warn        = "#f2b35e"
danger      = "#ff5f7a"
green       = "#a3c97a"

[ansi]
black   = "#241316"
red     = "#e5334b"
green   = "#a3c97a"
yellow  = "#f2b35e"
blue    = "#8a9fd4"
magenta = "#d9749d"
cyan    = "#7fbfb2"
white   = "#dcc4c4"
bright_black   = "#86585e"
bright_red     = "#ff5f7a"
bright_green   = "#bde39a"
bright_yellow  = "#ffcf85"
bright_blue    = "#a9bbe8"
bright_magenta = "#f09abb"
bright_cyan    = "#9fdad0"
bright_white   = "#f1dede"

[syntax]
keyword   = "#e5334b"
function  = "#ff8a57"
string    = "#e9c17e"
type      = "#f07e7e"
constant  = "#ffb08a"
property  = "#e3aaa9"
tag       = "#e5334b"
attribute = "#ff8a57"
operator  = "#c47d84"
comment   = "#86585e"

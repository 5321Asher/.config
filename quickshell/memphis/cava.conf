# cava for the horizon waveform (services/Radio.qml): raw ascii 0-100 per bar, bass first.
# Only runs while something is playing.
[general]
framerate = 40
bars = 36
autosens = 1

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
noise_reduction = 70

# Satty — opens after every screenshot (Snipping Tool style).
# Ctrl+C copy · Ctrl+S save to ~/Pictures/Screenshots · Ctrl+Shift+S save as (pick location) · Esc close
[general]
initial-tool = "arrow"
copy-command = "wl-copy"
output-filename = "~/Pictures/Screenshots/Screenshot_%Y-%m-%d_%H-%M-%S.png"
# stay open after copy/save so you can do both; Esc closes
early-exit = []
actions-on-enter = ["save-to-clipboard", "exit"]
actions-on-escape = ["exit"]
annotation-size-factor = 1
corner-roundness = 8
primary-highlighter = "block"
brush-smooth-history-size = 5
notification-thumbnail = "screenshot"
resize = { mode = "smart" }
floating-hack = true

# --- generated by wallpaper-colors.py, everything below is replaced ---
[color-palette]
palette = ["#c28e4e", "#5fd6b4", "#cc5a48", "#e0b050", "#8fc47a", "#ffffff", "#000000"]

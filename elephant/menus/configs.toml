# ~/.config/elephant/menus/configs.toml  (Style → Config files)
name = "configs"
name_pretty = "Config files"
icon = "󰒓"
parent = "style"
fixed_order = true
hide_from_providerlist = true
action = "%VALUE%"

[[entries]]
text = "Hyprland look"
subtext = "gaps, borders, animations (this setup)"
icon = "󰖲"
keywords = ["hyprland", "gaps", "border", "animation"]
value = "kitty -e nvim ~/.config/hypr/look.lua"

[[entries]]
text = "Kitty"
subtext = "padding, opacity (this setup; colours + font from the theme)"
icon = "󰄛"
keywords = ["kitty", "terminal", "font"]
value = "kitty -e nvim ~/.config/kitty/kitty.conf"

[[entries]]
text = "Walker style"
subtext = "layout + css (colours come from the theme)"
icon = "󰉼"
keywords = ["walker", "css", "style", "launcher"]
value = "kitty -e nvim ~/.config/walker/themes/active/style.css"

[[entries]]
text = "Quickshell"
subtext = "the bar and panels"
icon = "󰕮"
keywords = ["quickshell", "bar", "panel", "qml"]
value = "kitty -e nvim ~/.config/quickshell/default/"

[[entries]]
text = "Fastfetch layout"
subtext = "the template the theme renders from"
icon = "󰍹"
keywords = ["fastfetch", "fetch", "layout", "logo"]
value = "sh -c 'kitty -e nvim ~/.config/theme/setups/$(~/.config/theme/theme setup)/templates/fastfetch.jsonc'"

[[entries]]
text = "Theme settings"
subtext = "fastfetch logo box, cropping"
icon = "󰒓"
keywords = ["theme", "settings", "fastfetch", "crop"]
value = "kitty -e nvim ~/.config/theme/settings.toml"

[[entries]]
text = "Setup file"
subtext = "this setup's fonts, cursor, lock screen, default theme"
icon = "󰕮"
keywords = ["setup", "fonts", "cursor", "lock"]
value = "sh -c 'kitty -e nvim ~/.config/theme/setups/$(~/.config/theme/theme setup)/setup.toml'"

# ~/.config/elephant/menus/configs.toml  (Style → Config files)
name = "configs"
name_pretty = "Config files"
icon = "󰒓"
parent = "style"
fixed_order = true
hide_from_providerlist = true
action = "%VALUE%"

[[entries]]
text = "Hyprland look"
subtext = "gaps, borders, animations"
icon = "󰖲"
keywords = ["hyprland", "gaps", "border", "animation"]
value = "kitty -e nvim ~/.config/hypr/hyprland.lua"

[[entries]]
text = "Kitty"
subtext = "font, opacity (colours come from the theme)"
icon = "󰄛"
keywords = ["kitty", "terminal", "font"]
value = "kitty -e nvim ~/.config/kitty/kitty.conf"

[[entries]]
text = "Walker style"
subtext = "layout + css (colours come from the theme)"
icon = "󰉼"
keywords = ["walker", "css", "style", "launcher"]
value = "kitty -e nvim ~/.config/walker/themes/tokyonight/style.css"

[[entries]]
text = "Quickshell"
subtext = "the bar and panels"
icon = "󰕮"
keywords = ["quickshell", "bar", "panel", "qml"]
value = "kitty -e nvim ~/.config/quickshell"

[[entries]]
text = "Fastfetch layout"
subtext = "the template the theme renders from"
icon = "󰍹"
keywords = ["fastfetch", "fetch", "layout", "logo"]
value = "kitty -e nvim ~/.config/theme/templates/fastfetch.jsonc"

[[entries]]
text = "Theme settings"
subtext = "fastfetch logo box, cropping"
icon = "󰒓"
keywords = ["theme", "settings", "fastfetch", "crop"]
value = "kitty -e nvim ~/.config/theme/settings.toml"

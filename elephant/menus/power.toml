# ~/.config/elephant/menus/power.toml
# Rendered as a row of buttons — see walker/themes/<setup>/item_menus-power_grid.xml
name = "power"
name_pretty = "Power"
icon = "󰐥"
parent = "start"
fixed_order = true
hide_from_providerlist = true
action = "%VALUE%"

[[entries]]
text = "Lock"
icon = "󰌾"
keywords = ["lock"]
value = "loginctl lock-session"   # the active setup's lock screen (theme lock)

[[entries]]
text = "Suspend"
icon = "󰒲"
keywords = ["suspend", "sleep"]
value = "systemctl suspend"

[[entries]]
text = "Logout"
icon = "󰍃"
keywords = ["logout", "exit"]
value = "hyprctl dispatch 'hl.dsp.exit()'"

[[entries]]
text = "Reboot"
icon = "󰜉"
keywords = ["reboot", "restart"]
value = "systemctl reboot"

[[entries]]
text = "Shutdown"
icon = "󰐥"
keywords = ["shutdown", "poweroff"]
value = "systemctl poweroff"

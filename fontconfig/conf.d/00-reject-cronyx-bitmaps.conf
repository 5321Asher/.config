<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Chicago95's cronyx bitmap fonts claim Helvetica/Times/Courier; Chromium renders them invisible -->
<fontconfig>
  <selectfont>
    <rejectfont><glob>/usr/share/fonts/cronyx-cyrillic/*</glob></rejectfont>
  </selectfont>
</fontconfig>

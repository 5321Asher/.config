<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Generated from the Deep Field theme by ~/.config/theme/theme: the active setup's fonts for every generic family -->
<fontconfig>
  <alias binding="strong"><family>sans-serif</family><prefer><family>JetBrainsMono Nerd Font</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>Cormorant Garamond</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>JetBrainsMono Nerd Font</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>JetBrainsMono Nerd Font</family></prefer></alias>
  <alias binding="strong"><family>Adwaita Sans</family><prefer><family>JetBrainsMono Nerd Font</family></prefer></alias>
  <alias binding="strong"><family>Adwaita Mono</family><prefer><family>JetBrainsMono Nerd Font</family></prefer></alias>
</fontconfig>

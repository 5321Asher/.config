<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Make Cascadia Mono Nerd the default for every generic family -->
  <alias binding="strong"><family>sans-serif</family><prefer><family>CaskaydiaMono Nerd Font Mono</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>CaskaydiaMono Nerd Font Mono</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>CaskaydiaMono Nerd Font Mono</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>CaskaydiaMono Nerd Font Mono</family></prefer></alias>
  <alias binding="strong"><family>Adwaita Sans</family><prefer><family>CaskaydiaMono Nerd Font Mono</family></prefer></alias>
  <alias binding="strong"><family>Adwaita Mono</family><prefer><family>CaskaydiaMono Nerd Font Mono</family></prefer></alias>
</fontconfig>

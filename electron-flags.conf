# Native-Wayland Electron applies a monitor scale < 1 twice (0.67 laptop, 0.75 PC side monitors):
# the page is laid out shrunk into the top-left corner and the rest of the window is blank.
# Without fractional-scale-v1 it renders at 1x and Hyprland scales it down, right on every monitor.
# Read by every Arch electronNN launcher (Bitwarden on electron39, Obsidian on electron43) unless an
# electronNN-flags.conf exists. Discord ships its own Electron and drops this flag: see hypr/discord.sh
--disable-features=WaylandFractionalScaleV1

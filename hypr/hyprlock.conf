# Lock screen. Flat, sharp corners and outlined accents, like the Quickshell bar.
# Colours follow the wallpaper: hyprlock-colors.conf is rewritten by
# ~/.config/quickshell/scripts/wallpaper-colors.py whenever skwd-wall (skwd-iris) changes the palette,
# and hyprlock reads it fresh on every lock.
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

$font = CaskaydiaMono Nerd Font Mono

# Tokyo Night fallback until a wallpaper palette exists (overridden by the source below)
$bg          = rgb(1a1b26)
$bgDark      = rgb(16161e)
$surface     = rgb(292e42)
$border      = rgb(414868)
$dim         = rgb(565f89)
$fg          = rgb(c0caf5)
$accent      = rgb(7aa2f7)
$accentText  = rgb(16161e)
$purple      = rgb(bb9af7)
$warn        = rgb(e0af68)
$danger      = rgb(f7768e)
$shade       = rgba(16161e99)

source = ~/.config/hypr/hyprlock-colors.conf


####################
#### GENERAL ####
####################

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 4, easeOutQuint
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, linear
}


####################
#### BACKGROUND ####
####################

# The current desktop (skwd wallpaper included), blurred and dimmed
background {
    monitor =
    path = screenshot
    color = $bgDark
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
    vibrancy = 0.17
}

# Panel behind the clock and password field
shape {
    monitor =
    size = 360, 300
    color = $shade
    rounding = 0
    border_size = 1
    border_color = $border
    position = 0, 20
    halign = center
    valign = center
}


####################
#### CLOCK ####
####################

label {
    monitor =
    text = <b>$TIME</b>
    color = $fg
    font_size = 64
    font_family = $font
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%a %-d %b"
    color = $dim
    font_size = 14
    font_family = $font
    position = 0, 40
    halign = center
    valign = center
}


####################
#### UNLOCK ####
####################

input-field {
    monitor =
    size = 300, 44
    rounding = 0
    outline_thickness = 2

    # Same accent gradient as the window borders
    outer_color = $accent $purple 45deg
    inner_color = $bgDark
    font_color = $fg
    check_color = $purple
    fail_color = $danger
    capslock_color = $warn

    font_family = $font
    placeholder_text = <i>󰌾  $USER</i>
    fail_text = $PAMFAIL ($ATTEMPTS)
    fade_on_empty = false
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = 0

    position = 0, -30
    halign = center
    valign = center
}


####################
#### STATUS ####
####################

label {
    monitor =
    text = $LAYOUT
    color = $dim
    font_size = 11
    font_family = $font
    position = 0, -80
    halign = center
    valign = center
}

# Battery (empty on machines without one)
label {
    monitor =
    text = cmd[update:30000] cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1 | sed 's/.*/󰁹 &%/'
    color = $dim
    font_size = 11
    font_family = $font
    position = -20, 16
    halign = right
    valign = bottom
}

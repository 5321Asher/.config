# Idle handling: dim → lock (hyprlock) → screen off → suspend.
# Started from hyprland.lua's autostart. https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

####################
#### GENERAL ####
####################

general {
    lock_cmd = pidof hyprlock || hyprlock                             # one hyprlock at a time
    unlock_cmd = pkill -USR1 hyprlock
    before_sleep_cmd = loginctl lock-session                          # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # screen on after resume, no key press needed
    ignore_dbus_inhibit = false                                       # videos / calls keep the screen awake
}


####################
#### LISTENERS ####
####################

# 2.5 min: dim the laptop panel (needs brightnessctl; does nothing without it)
listener {
    timeout = 150
    on-timeout = command -v brightnessctl >/dev/null && brightnessctl -s set 10%
    on-resume = command -v brightnessctl >/dev/null && brightnessctl -r
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screen off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 30 min: suspend
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
